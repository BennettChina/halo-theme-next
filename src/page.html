<include
  src="/partials/shell.html"
  bodyClass="index posts-expand"
  pageClass="index posts-expand"
  sidebarClass="sidebar-nav-active sidebar-toc-active"
>
  <template name="head">
    <title th:text="|${singlePage.spec.title} - ${site.title}|">Page</title>
  </template>

  <template name="pageConfig">
    <script
      class="next-config"
      data-name="page"
      type="application/json"
      th:inline="javascript"
    >
      {
        "sidebar": /*[[${#annotations.getOrDefault(singlePage, 'sidebar', '1') == '1'}]]*/ true,
        "isHome": false,
        "isPost": false,
        "lang": /*[[${#locale.toLanguageTag}]]*/ "en",
        "comments": /*[[${haloCommentEnabled ?: false}]]*/ false,
        "permalink": /*[[${singlePage.status.permalink}]]*/ "",
        "path": /*[[${singlePage.status.permalink}]]*/ "",
        "title": /*[[${singlePage.spec.title}]]*/ ""
      }
    </script>
  </template>

  <include src="/partials/page-article.html"></include>
  <include src="/partials/comments-page.html"></include>
</include>
