<include
  src="/partials/shell.html"
  bodyClass="archive posts-collapse"
  pageClass="archive posts-collapse"
  sidebarClass="sidebar-overview-active"
>
  <template name="head">
    <title th:text="|#{site.archives} - ${site.title}|">Archives</title>
  </template>

  <div class="post-block animated fadeIn">
    <div class="post-content">
      <div class="collection-title">
        <span
          class="collection-header animated fadeInLeft"
          th:text="#{site.totalPosts(${archives.total})}"
        ></span>
      </div>

      <th:block th:each="archive : ${archives.items}">
        <div class="collection-year">
          <span class="collection-header animated fadeInLeft" th:text="${archive.year}"></span>
        </div>
        <th:block th:each="month : ${archive.months}">
          <div class="collection-month" th:text="${month.month}"></div>
          <th:block th:each="post : ${month.posts}">
            <include src="/partials/compact-post.html"></include>
          </th:block>
        </th:block>
      </th:block>

      <p class="post-empty" th:if="${#lists.isEmpty(archives.items)}" th:text="#{site.empty}">
        No posts yet.
      </p>
    </div>
  </div>

  <th:block th:with="posts=${archives}">
    <include src="/partials/pagination.html"></include>
  </th:block>
</include>
