<th:block th:fragment="items(menuItems, iconEnabled)">
  <li
    th:each="item : ${menuItems}"
    class="menu-item animated fadeInDown"
    th:classappend="${item.status.href == '/' ? ' menu-item-home' : ''}"
  >
    <a th:href="@{${item.status.href}}" th:target="${item.spec.target?.value}" rel="section">
      <th:block th:with="iconClass=${#annotations.getOrDefault(item, 'icon_class', '')}">
        <th:block th:if="${iconEnabled and not #strings.isEmpty(iconClass)}">
          <span
            th:if="${#strings.startsWith(#strings.trim(iconClass), '<svg')}"
            class="theme-icon-svg menu-icon-svg"
            th:utext="${iconClass}"
          ></span>
          <i
            th:unless="${#strings.startsWith(#strings.trim(iconClass), '<svg')}"
            th:class="${iconClass + ' fa-fw'}"
          ></i>
        </th:block>
      </th:block>
      <span th:text="${item.status.displayName}"></span>
    </a>
    <th:block th:if="${item.children != null and not #lists.isEmpty(item.children)}">
      <ul class="sub-menu menu">
        <th:block
          th:replace="~{modules/menu-tree :: items(menuItems=${item.children}, iconEnabled=${iconEnabled})}"
        ></th:block>
      </ul>
    </th:block>
  </li>
</th:block>
