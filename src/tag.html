<include
  src="/partials/shell.html"
  bodyClass="tag posts-collapse"
  pageClass="tag posts-collapse"
  sidebarClass="sidebar-overview-active"
>
  <template name="head">
    <title th:text="|${tag.spec.displayName} - ${site.title}|">Tag</title>
  </template>

  <div class="post-block animated fadeIn">
    <div class="post-content">
      <div class="collection-title">
        <h1 class="collection-header animated fadeInLeft">
          <span th:text="${tag.spec.displayName}"></span>
          <small th:text="#{site.tag}">Tag</small>
        </h1>
      </div>

      <th:block th:each="post : ${posts.items}">
        <include src="/partials/compact-post.html"></include>
      </th:block>

      <p class="post-empty" th:if="${#lists.isEmpty(posts.items)}" th:text="#{site.empty}">
        No posts yet.
      </p>
    </div>
  </div>

  <include src="/partials/pagination.html"></include>
</include>
