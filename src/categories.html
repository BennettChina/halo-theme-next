<include
  src="/partials/shell.html"
  bodyClass="page posts-expand"
  pageClass="page posts-expand"
  sidebarClass="sidebar-overview-active"
>
  <template name="head">
    <title th:text="|#{site.categories} - ${site.title}|">Categories</title>
  </template>

  <div class="post-block animated fadeIn">
    <header class="post-header animated fadeInDown">
      <h1 class="post-title" th:text="#{site.categories}">Categories</h1>
    </header>
    <div class="post-body animated fadeInDown">
      <div class="category-all-page">
        <div
          class="category-all-title"
          th:with="stats=${siteStatsFinder.getStats()}"
          th:text="#{site.categoryCount(${stats.category})}"
        ></div>

        <ul class="category-list">
          <th:block
            th:replace="~{modules/category-tree :: items(categories=${categories})}"
          ></th:block>
        </ul>

        <p class="post-empty" th:if="${#lists.isEmpty(categories)}" th:text="#{site.empty}">
          No categories yet.
        </p>
      </div>
    </div>
  </div>
</include>
