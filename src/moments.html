<include
  src="/partials/shell.html"
  bodyClass="page posts-expand"
  pageClass="page posts-expand"
  sidebarClass="sidebar-overview-active"
>
  <template name="head">
    <title th:text="|${title ?: #messages.msg('site.moments')} - ${site.title}|">Moments</title>
  </template>

  <section class="post-block plugin-page moments-page animated fadeIn">
    <article class="post-content">
      <header class="post-header animated fadeInDown">
        <h1 class="post-title" th:text="${title ?: #messages.msg('site.moments')}">Moments</h1>
      </header>

      <nav class="module-tabs" th:if="${not #lists.isEmpty(tags)}" th:attr="aria-label=#{site.moments}">
        <a
          th:href="@{/moments}"
          th:classappend="${param.tag == null or #arrays.length(param.tag) == 0} ? 'is-active'"
          th:text="#{site.all}"
        ></a>
        <a
          th:each="tag : ${tags}"
          th:href="${tag.permalink}"
          th:classappend="${param.tag != null and #arrays.contains(param.tag, tag.name)} ? 'is-active'"
          th:text="|${tag.name} (${tag.momentCount})|"
        ></a>
      </nav>

      <div class="moments-timeline" th:if="${not #lists.isEmpty(moments.items)}">
        <article
          class="moment-card"
          th:each="moment : ${moments.items}"
          th:with="
            content=${moment.spec.content},
            releaseTime=${moment.spec.releaseTime ?: moment.metadata.creationTimestamp},
            contentHtml=${content?.html ?: ''}
          "
        >
          <header class="moment-card__header">
            <span class="moment-card__owner" th:if="${moment.owner != null}">
              <img
                th:if="${not #strings.isEmpty(moment.owner.avatar)}"
                th:src="${moment.owner.avatar}"
                th:alt="${moment.owner.displayName}"
                loading="lazy"
              />
              <strong th:text="${moment.owner.displayName}">Owner</strong>
            </span>
            <a
              class="moment-card__time"
              th:if="${releaseTime != null}"
              th:href="@{/moments/{name}(name=${moment.metadata.name})}"
            >
              <time
                th:datetime="${releaseTime}"
                th:text="${#temporals.format(releaseTime, 'yyyy-MM-dd HH:mm')}"
              ></time>
            </a>
          </header>

          <div
            class="moment-card__content"
            th:if="${not #strings.isEmpty(contentHtml)}"
            th:utext="${contentHtml}"
          ></div>

          <div class="moment-card__media" th:if="${not #lists.isEmpty(content.medium)}">
            <th:block th:each="medium : ${content.medium}">
              <img
                th:if="${medium.type.name == 'PHOTO'}"
                th:src="${medium.url}"
                th:alt="#{site.momentImage}"
                loading="lazy"
              />
              <video
                th:if="${medium.type.name == 'VIDEO'}"
                th:src="${medium.url}"
                controls
              ></video>
              <audio
                th:if="${medium.type.name == 'AUDIO'}"
                th:src="${medium.url}"
                controls
              ></audio>
              <a
                th:if="${medium.type.name == 'POST'}"
                th:href="${medium.url}"
                class="moment-card__link"
                th:text="#{site.readPost}"
              ></a>
            </th:block>
          </div>

          <footer class="moment-card__footer" th:if="${not #lists.isEmpty(moment.spec.tags)}">
            <a
              th:each="momentTag : ${moment.spec.tags}"
              th:href="@{/moments(tag=${momentTag})}"
              th:text="|#${momentTag}|"
            ></a>
          </footer>
        </article>
      </div>

      <p class="post-empty" th:if="${#lists.isEmpty(moments.items)}" th:text="#{site.noMoments}">
        No moments yet.
      </p>

      <nav class="plugin-pagination" th:if="${moments.hasPrevious() or moments.hasNext()}">
        <a th:if="${moments.hasPrevious()}" th:href="${moments.prevUrl}" th:text="#{site.previousPage}"></a>
        <span th:text="|${moments.page} / ${moments.totalPages}|">1 / 1</span>
        <a th:if="${moments.hasNext()}" th:href="${moments.nextUrl}" th:text="#{site.nextPage}"></a>
      </nav>
    </article>
  </section>
</include>
