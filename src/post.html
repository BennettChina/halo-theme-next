<include
  src="/partials/shell.html"
  bodyClass="index posts-expand"
  pageClass="index posts-expand"
  sidebarClass="sidebar-nav-active sidebar-toc-active"
>
  <template name="head">
    <title th:text="|${post.spec.title} - ${site.title}|">Post</title>
  </template>

  <template name="pageConfig">
    <script
      class="next-config"
      data-name="page"
      type="application/json"
      th:inline="javascript"
    >
      {
        "sidebar": /*[[${#annotations.getOrDefault(post, 'sidebar', '1') == '1'}]]*/ true,
        "isHome": false,
        "isPost": true,
        "lang": /*[[${#locale.toLanguageTag}]]*/ "en",
        "comments": /*[[${haloCommentEnabled ?: false}]]*/ false,
        "permalink": /*[[${post.status.permalink}]]*/ "",
        "path": /*[[${post.status.permalink}]]*/ "",
        "title": /*[[${post.spec.title}]]*/ ""
      }
    </script>
  </template>

  <include src="/partials/post-article.html"></include>
  <include src="/partials/comments-post.html"></include>
</include>
