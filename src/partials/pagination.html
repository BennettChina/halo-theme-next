<nav class="pagination animated fadeIn" th:if="${posts.hasPrevious() or posts.hasNext()}">
  <a
    class="extend prev"
    rel="prev"
    th:if="${posts.hasPrevious()}"
    th:href="@{${posts.prevUrl}}"
    th:title="#{site.previousPage}"
    th:attr="aria-label=${#messages.msg('site.previousPage')}"
  >
    <i class="fa fa-angle-left"></i>
  </a>
  <span class="page-number current" th:text="${posts.page}">1</span>
  <span class="page-number" th:text="|/ ${posts.totalPages}|">/ 1</span>
  <a
    class="extend next"
    rel="next"
    th:if="${posts.hasNext()}"
    th:href="@{${posts.nextUrl}}"
    th:title="#{site.nextPage}"
    th:attr="aria-label=${#messages.msg('site.nextPage')}"
  >
    <i class="fa fa-angle-right"></i>
  </a>
</nav>
