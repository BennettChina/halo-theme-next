<a class="link-card" th:href="${link.spec.url}" target="_blank" rel="noopener noreferrer">
  <span class="link-card__logo">
    <img
      th:if="${not #strings.isEmpty(link.spec.logo)}"
      th:src="${link.spec.logo}"
      th:alt="${link.spec.displayName}"
      loading="lazy"
    />
    <i th:unless="${not #strings.isEmpty(link.spec.logo)}" class="fa fa-link"></i>
  </span>
  <span class="link-card__content">
    <strong class="link-card__name" th:text="${link.spec.displayName}">Link</strong>
    <span
      class="link-card__description"
      th:if="${not #strings.isEmpty(link.spec.description)}"
      th:text="${link.spec.description}"
    ></span>
  </span>
</a>
