<th:block
  th:with="
    menu=${menuFinder.getPrimary()},
    hasMenu=${menu != null and menu.menuItems != null and not #lists.isEmpty(menu.menuItems)},
    siteTitle=${theme.config.basic.site?.type == 1 ? site.title : (theme.config.basic.site?.title ?: site.title)},
    siteSubtitle=${theme.config.basic.site?.type == 1 ? (site.subtitle ?: '') : (theme.config.basic.site?.subtitle ?: '')},
    logoUrl=${theme.config.basic.custom_logo?.custom_enabled == 1 ? (theme.config.basic.custom_logo?.url ?: site.logo) : site.logo},
    searchEnabled=${theme.config.third.search?.enabled == 1 and pluginFinder.available('PluginSearchWidget')}
  "
>
  <div class="site-brand-container">
    <div class="site-nav-toggle">
      <div class="toggle" role="button" aria-label="Toggle navigation">
        <th:block th:if="${hasMenu}">
          <span class="toggle-line"></span>
          <span class="toggle-line"></span>
          <span class="toggle-line"></span>
        </th:block>
      </div>
    </div>

    <div class="site-meta">
      <img
        th:if="${theme.config.basic.custom_logo?.enabled == 1 and not #strings.isEmpty(logoUrl)}"
        class="custom-logo-image"
        th:src="${logoUrl}"
        th:alt="${siteTitle}"
      />
      <a th:href="@{/}" class="brand" rel="start">
        <i class="logo-line"></i>
        <h1
          th:if="${_templateId == 'index' or _templateId == 'archives'}"
          class="site-title"
          th:text="${siteTitle}"
        >
          Site title
        </h1>
        <p
          th:unless="${_templateId == 'index' or _templateId == 'archives'}"
          class="site-title"
          th:text="${siteTitle}"
        >
          Site title
        </p>
        <i class="logo-line"></i>
      </a>
      <p
        class="site-subtitle"
        th:if="${not #strings.isEmpty(siteSubtitle)}"
        th:text="${siteSubtitle}"
      ></p>
    </div>

    <div class="site-nav-right"></div>
  </div>

  <nav class="site-nav" th:if="${hasMenu}">
    <ul class="main-menu menu">
      <th:block th:replace="~{modules/menu-tree :: items(menuItems=${menu.menuItems})}"></th:block>

      <li class="menu-item menu-item-search animated fadeInDown" th:if="${searchEnabled}">
        <a role="button" class="popup-trigger" href="javascript:SearchWidget.open()">
          <i class="fa fa-search fa-fw"></i>
          <span th:text="#{site.search}">Search</span>
        </a>
      </li>
    </ul>
  </nav>
</th:block>
