<div class="post-block animated fadeIn">
  <article
    class="post-content"
    itemscope
    itemtype="http://schema.org/Article"
    th:with="
      postContent=${postFinder.content(post.metadata.name)},
      contentHtml=${postContent?.content ?: ''},
      indexImage=${post.spec.cover},
      excerptParagraphs=${#strings.toString(theme.config.post.index_excerpt_paragraphs ?: 3)},
      p1Html=${#strings.substringBefore(#strings.substringAfter(contentHtml, '<p>'), '</p>')},
      rest1=${#strings.substringAfter(contentHtml, '</p>')},
      p2Html=${#strings.substringBefore(#strings.substringAfter(rest1, '<p>'), '</p>')},
      rest2=${#strings.substringAfter(rest1, '</p>')},
      p3Html=${#strings.substringBefore(#strings.substringAfter(rest2, '<p>'), '</p>')},
      rest3=${#strings.substringAfter(rest2, '</p>')},
      p4Html=${#strings.substringBefore(#strings.substringAfter(rest3, '<p>'), '</p>')},
      rest4=${#strings.substringAfter(rest3, '</p>')},
      p5Html=${#strings.substringBefore(#strings.substringAfter(rest4, '<p>'), '</p>')}
    "
  >
    <header class="post-header animated fadeInDown">
      <h2 class="post-title" itemprop="name headline">
        <span th:if="${post.spec.pinned}" class="post-sticky-flag" title="Sticky">
          <i class="fa fa-thumbtack"></i>
        </span>
        <a
          class="post-title-link"
          itemprop="url"
          th:href="@{${post.status.permalink}}"
          th:text="${post.spec.title}"
        ></a>
      </h2>
      <div class="post-meta-container">
        <include src="/partials/post-meta.html"></include>
      </div>
    </header>

    <a
      class="post-cover animated fadeIn"
      th:if="${theme.config.post.index_image != 0 and not #strings.isEmpty(indexImage)}"
      th:href="@{${post.status.permalink}}"
      th:title="${post.spec.title}"
    >
      <img th:src="${indexImage}" th:alt="${post.spec.title}" loading="lazy" />
    </a>

    <div
      class="post-body animated fadeInDown"
      itemprop="articleBody"
      th:if="${theme.config.post.excerpt_description != 0 and (not #strings.isEmpty(post.status.excerpt) or not #strings.isEmpty(contentHtml))}"
    >
      <div
        class="post-list-content"
        th:if="${theme.config.post.index_content != 'text' and not #strings.isEmpty(p1Html)}"
      >
        <p th:utext="${p1Html}"></p>
        <p
          th:if="${(excerptParagraphs == '2' or excerptParagraphs == '3' or excerptParagraphs == '4' or excerptParagraphs == '5') and not #strings.isEmpty(p2Html)}"
          th:utext="${p2Html}"
        ></p>
        <p
          th:if="${(excerptParagraphs == '3' or excerptParagraphs == '4' or excerptParagraphs == '5') and not #strings.isEmpty(p3Html)}"
          th:utext="${p3Html}"
        ></p>
        <p
          th:if="${(excerptParagraphs == '4' or excerptParagraphs == '5') and not #strings.isEmpty(p4Html)}"
          th:utext="${p4Html}"
        ></p>
        <p
          th:if="${excerptParagraphs == '5' and not #strings.isEmpty(p5Html)}"
          th:utext="${p5Html}"
        ></p>
      </div>
      <p
        th:if="${theme.config.post.index_content == 'text' and not #strings.isEmpty(post.status.excerpt)}"
        th:text="${post.status.excerpt}"
      ></p>
      <p
        th:if="${theme.config.post.index_content != 'text' and #strings.isEmpty(p1Html) and not #strings.isEmpty(post.status.excerpt)}"
        th:text="${post.status.excerpt}"
      ></p>
      <div class="post-button" th:if="${#strings.toString(theme.config.post.read_more_btn) != '0'}">
        <a
          class="btn"
          rel="contents"
          th:href="@{${post.status.permalink}}"
          th:text="#{site.readMore}"
        ></a>
      </div>
    </div>

    <footer class="post-footer">
      <div class="post-eof"></div>
    </footer>
  </article>
</div>
