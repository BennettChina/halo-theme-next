<div
  class="post-copyright"
  th:if="${theme.config.basic.creative_commons?.enabled == 1 and theme.config.basic.creative_commons?.post == 1 and #annotations.getOrDefault(post, 'copyright', '1') == '1'}"
  th:with="
    license=${theme.config.basic.creative_commons?.license ?: 'by-nc-sa'},
    language=${theme.config.basic.creative_commons?.language ?: ''},
    licenseUrl=${(license == 'cc-zero' ? 'https://creativecommons.org/publicdomain/zero/1.0/' : 'https://creativecommons.org/licenses/' + license + '/4.0/') + language},
    siteBaseUrl=${#strings.endsWith(site.url, '/') ? #strings.substring(site.url, 0, #strings.length(site.url) - 1) : site.url}
  "
>
  <ul>
    <li class="post-copyright-author">
      <strong th:text="#{site.author}">Author</strong>
      <span th:text="${post.owner?.displayName ?: post.owner?.name ?: site.title}"></span>
    </li>
    <li class="post-copyright-link" th:if="${post.status.permalink != null}">
      <strong th:text="#{site.articleLink}">Link</strong>
      <a
        th:href="@{${post.status.permalink}}"
        th:text="${siteBaseUrl + post.status.permalink}"
        th:title="${post.spec.title}"
      ></a>
    </li>
    <li class="post-copyright-license">
      <strong th:text="#{site.copyright}">Copyright</strong>
      <span th:text="#{site.licenseNotice}">Licensed under</span>
      <a th:href="${licenseUrl}" rel="noopener" target="_blank">
        <i class="fab fa-fw fa-creative-commons"></i>
        <span th:text="${#strings.toUpperCase(license)}"></span>
      </a>
    </li>
  </ul>
</div>
