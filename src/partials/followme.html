<div
  class="followme"
  th:if="${theme.config.post.follow_me?.enabled == 1 and not #lists.isEmpty(theme.config.post.follow_me?.account)}"
>
  <span th:text="#{site.followMe}">Follow me</span>
  <div class="social-list">
    <div
      class="social-item"
      th:each="account : ${theme.config.post.follow_me?.account}"
      th:with="isImage=${account.type == 'img' or (account.url != null and (account.url.endsWith('.png') or account.url.endsWith('.jpg')))}"
    >
      <th:block th:if="${isImage}">
        <span class="social-link">
          <span class="icon">
            <i th:if="${not #strings.isEmpty(account.icon)}" th:class="${account.icon}"></i>
          </span>
          <span class="label" th:text="${account.name}"></span>
        </span>
        <img
          class="social-item-img"
          th:src="${not #strings.isEmpty(account.img_url) ? account.img_url : account.url}"
          th:alt="${account.name}"
        />
      </th:block>
      <a
        th:unless="${isImage}"
        class="social-link"
        target="_blank"
        rel="noopener"
        th:href="@{${account.url}}"
      >
        <span class="icon">
          <i th:if="${not #strings.isEmpty(account.icon)}" th:class="${account.icon}"></i>
        </span>
        <span class="label" th:text="${account.name}"></span>
      </a>
    </div>
  </div>
</div>
