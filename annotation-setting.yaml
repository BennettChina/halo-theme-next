apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: theme-next-menuitem-1a34
spec:
  targetRef:
    group: ""
    kind: MenuItem
  formSchema:
    # 菜单项扩展
    - $formkit: "iconify"
      name: "icon_class"
      label: "图标 - Next"
      help: "点击图标按钮选择；旧版 Font Awesome 编码仍兼容。"
      format: "svg"
      value-only: true

---
# 文章元数据扩展 see https://theme-next.js.org/docs/advanced-settings/front-matter.html?highlight=sticky
apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: theme-next-post-1a34
spec:
  targetRef:
    group: "content.halo.run"
    kind: Post
  formSchema:
    # 是否显示侧边栏
    - $formkit: "select"
      name: "sidebar"
      help: ""
      label: "是否显示侧边栏 - Next"
      value: 1
      options:
        - label: 显示
          value: 1
        - label: 隐藏
          value: 0
    # 是否显示版权声明
    - $formkit: "select"
      name: "copyright"
      help: ""
      label: "是否显示版权声明 - Next"
      value: 1
      options:
        - label: 显示
          value: 1
        - label: 隐藏
          value: 0
    # huk
    - $formkit: "select"
      name: "direction"
      help: ""
      label: "direction - Next"
      value: ""
      options:
        - label: rtl
          value: "rtl"
        - label: 不设置
          value: ""
